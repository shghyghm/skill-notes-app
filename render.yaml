services:
  - type: web
    name: skill-notes-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: skill-notes-db
          property: connectionString

  - type: web
    name: skill-notes-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "echo 'Frontend ready'"
    staticPublishPath: frontend
    routes:
      - path: /api
        destination: skill-notes-backend

databases:
  - name: skill-notes-db
    databaseName: skill_notes
    region: oregon
    plan: free
