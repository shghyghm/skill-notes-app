<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skill Notes - Smart Learning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .fade-enter {
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .slide-in {
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app" class="fade-enter"></div>

  <script>
    // Determine API URL based on environment
    const API = window.location.hostname === "localhost" 
      ? "http://localhost:8000"
      : `${window.location.protocol}//${window.location.hostname}:8000`;
    
    let currentToken = localStorage.getItem("token");
    let selectedSkill = null;
    let allSkills = [];

    // ============ API CALLS ============
    async function apiCall(method, endpoint, data = null) {
      try {
        const config = {
          method,
          url: `${API}${endpoint}`,
          headers: {
            "Content-Type": "application/json"
          }
        };
        
        if (currentToken) {
          config.headers["Authorization"] = `Bearer ${currentToken}`;
        }
        
        if (data) {
          config.data = data;
        }
        
        console.log('API Call:', method, endpoint, data);
        const res = await axios(config);
        console.log('API Response:', res.data);
        return res.data;
      } catch (error) {
        console.error('API Error:', error.response?.data || error.message);
        const msg = error.response?.data?.detail || error.message || "Unknown error";
        showNotification(msg, "error");
        throw error;
      }
    }

    async function login(email, password) {
      const data = await apiCall("POST", "/login", { email, password });
      currentToken = data.access_token;
      localStorage.setItem("token", currentToken);
      showNotification("Welcome! 🎉", "success");
      await render();
    }

    async function signup(username, email, password) {
      await apiCall("POST", "/signup", { username, email, password });
      showNotification("Sign up successful! Please log in now", "success");
      switchMode("login");
    }

    async function getSkills() {
      try {
        return await apiCall("GET", "/skills/");
      } catch {
        return [];
      }
    }

    async function createSkill(title) {
      const skill = await apiCall("POST", "/skills/", { title });
      showNotification("Skill added ✅", "success");
      return skill;
    }

    async function deleteSkill(skillId) {
      await apiCall("DELETE", `/skills/${skillId}/`);
      showNotification("Skill deleted", "success");
    }

    async function getNotes(skillId) {
      try {
        return await apiCall("GET", `/skills/${skillId}/notes/`);
      } catch {
        return [];
      }
    }

    async function createNote(skillId, content) {
      const note = await apiCall("POST", `/skills/${skillId}/notes/`, { content });
      showNotification("Note added ✅", "success");
      return note;
    }

    async function deleteNote(skillId, noteId) {
      await apiCall("DELETE", `/skills/${skillId}/notes/${noteId}/`);
      showNotification("Note deleted", "success");
    }

    // ============ UI FUNCTIONS ============
    function showNotification(msg, type = "info") {
      const color = type === "success" ? "bg-green-500" : type === "error" ? "bg-red-500" : "bg-blue-500";
      const notif = document.createElement("div");
      notif.className = `fixed top-4 right-4 ${color} text-white px-6 py-3 rounded-lg shadow-lg fade-enter z-50 max-w-xs`;
      notif.textContent = msg;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    function switchMode(mode) {
      const loginMode = document.getElementById("login-mode");
      const signupMode = document.getElementById("signup-mode");
      if (mode === "login") {
        loginMode.style.display = "block";
        signupMode.style.display = "none";
      } else {
        loginMode.style.display = "none";
        signupMode.style.display = "block";
      }
    }

    async function logout() {
      currentToken = null;
      selectedSkill = null;
      localStorage.removeItem("token");
      await render();
    }

    // ============ EVENT HANDLERS ============
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email")?.value?.trim();
      const password = document.getElementById("login-password")?.value?.trim();
      
      if (!email || !password) {
        showNotification("Please fill in all fields", "error");
        return;
      }
      
      try {
        await login(email, password);
      } catch (err) {
        console.error('Login error:', err);
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const username = document.getElementById("signup-username")?.value?.trim();
      const email = document.getElementById("signup-email")?.value?.trim();
      const password = document.getElementById("signup-password")?.value?.trim();
      
      if (!username || !email || !password) {
        showNotification("Please fill in all fields", "error");
        return;
      }
      
      try {
        await signup(username, email, password);
      } catch (err) {
        console.error('Signup error:', err);
      }
    }

    async function handleAddSkill() {
      const input = document.getElementById("skill-input");
      const title = input?.value?.trim();
      if (!title) {
        showNotification("Please enter skill name", "error");
        return;
      }
      try {
        await createSkill(title);
        input.value = "";
        await render();
      } catch (err) {
        console.error('Add skill error:', err);
      }
    }

    async function selectSkill(skill) {
      selectedSkill = skill;
      await render();
    }

    async function handleDeleteSkill(skillId, e) {
      e.stopPropagation();
      if (!confirm("Are you sure you want to delete this skill?")) return;
      try {
        await deleteSkill(skillId);
        selectedSkill = null;
        await render();
      } catch (err) {
        console.error('Delete skill error:', err);
      }
    }

    async function handleAddNote() {
      if (!selectedSkill) return;
      const input = document.getElementById("note-input");
      const content = input?.value?.trim();
      if (!content) {
        showNotification("Please enter note content", "error");
        return;
      }
      try {
        await createNote(selectedSkill.id, content);
        input.value = "";
        await render();
      } catch (err) {
        console.error('Add note error:', err);
      }
    }

    async function handleDeleteNote(noteId, e) {
      e.stopPropagation();
      if (!confirm("Are you sure you want to delete this note?")) return;
      try {
        await deleteNote(selectedSkill.id, noteId);
        await render();
      } catch (err) {
        console.error('Delete note error:', err);
      }
    }

    // ============ RENDER FUNCTIONS ============
    function renderLoginPage() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-blue-600 via-purple-600 to-pink-600 flex items-center justify-center p-4">
          <div class="max-w-md w-full">
            <div class="text-center mb-8 slide-in">
              <div class="inline-flex bg-white bg-opacity-20 p-4 rounded-full mb-4 backdrop-blur-md">
                <i class="fas fa-book-open text-4xl text-white"></i>
              </div>
              <h1 class="text-4xl font-bold text-white mb-2">Skill Notes</h1>
              <p class="text-blue-100 text-lg">Smart Learning Hub 🚀</p>
            </div>

            <div class="bg-white bg-opacity-95 backdrop-blur-md rounded-3xl shadow-2xl p-8 space-y-6 slide-in">
              <!-- Login Mode -->
              <div id="login-mode">
                <h2 class="text-3xl font-bold mb-2 text-gray-800">Welcome Back</h2>
                <p class="text-gray-600 mb-6">Sign in to continue learning</p>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">📧 Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">🔒 Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" required />
                  </div>
                  <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transform hover:scale-105 transition duration-200 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                  </button>
                </form>
                <p class="text-center mt-6 text-gray-600">
                  Don't have an account?
                  <button onclick="switchMode('signup')" class="text-blue-600 font-bold hover:text-blue-800 transition">Sign Up</button>
                </p>
              </div>

              <!-- Signup Mode -->
              <div id="signup-mode" style="display:none;">
                <h2 class="text-3xl font-bold mb-2 text-gray-800">Create Account</h2>
                <p class="text-gray-600 mb-6">Join the smart learning community</p>
                <form onsubmit="handleSignup(event)" class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">👤 Username</label>
                    <input type="text" id="signup-username" placeholder="john_doe" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">📧 Email</label>
                    <input type="email" id="signup-email" placeholder="your@email.com" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" required />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">🔒 Password</label>
                    <input type="password" id="signup-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" required />
                  </div>
                  <button type="submit" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transform hover:scale-105 transition duration-200 flex items-center justify-center gap-2">
                    <i class="fas fa-user-plus"></i> Create Account
                  </button>
                </form>
                <p class="text-center mt-6 text-gray-600">
                  Already have an account?
                  <button onclick="switchMode('login')" class="text-blue-600 font-bold hover:text-blue-800 transition">Sign In</button>
                </p>
              </div>
            </div>

            <!-- Features -->
            <div class="mt-12 grid grid-cols-3 gap-4 text-center text-white">
              <div class="slide-in" style="animation-delay: 0.1s;">
                <div class="text-3xl mb-2">📚</div>
                <p class="text-sm font-medium">Multiple Skills</p>
              </div>
              <div class="slide-in" style="animation-delay: 0.2s;">
                <div class="text-3xl mb-2">📝</div>
                <p class="text-sm font-medium">Smart Notes</p>
              </div>
              <div class="slide-in" style="animation-delay: 0.3s;">
                <div class="text-3xl mb-2">🔒</div>
                <p class="text-sm font-medium">Secure & Private</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function renderDashboard() {
      const skillsHtml = allSkills.map(skill => `
        <div class="group p-4 rounded-xl border-2 ${selectedSkill?.id === skill.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200 bg-white hover:border-blue-300'} cursor-pointer transition transform hover:scale-105 slide-in" onclick="selectSkill(${JSON.stringify(skill).replace(/"/g, '&quot;')})">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <h3 class="font-bold text-lg text-gray-800">${skill.title}</h3>
              <p class="text-sm text-gray-500">${skill.notes?.length || 0} notes</p>
            </div>
            <button onclick="handleDeleteSkill(${skill.id}, event)" class="opacity-0 group-hover:opacity-100 bg-red-100 text-red-600 hover:bg-red-200 p-2 rounded-lg transition">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      `).join("");

      if (selectedSkill) {
        return await renderSkillDetail();
      }

      return `
        <div class="min-h-screen bg-gray-50">
          <!-- Header -->
          <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
              <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                  <i class="fas fa-book-open"></i> Skill Notes
                </h1>
              </div>
              <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg transition flex items-center gap-2 shadow-md hover:shadow-lg">
                <i class="fas fa-sign-out-alt"></i> Sign Out
              </button>
            </div>
          </header>

          <!-- Main Content -->
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8">
              <h2 class="text-2xl font-bold text-gray-800 mb-4">🎯 My Skills</h2>
              <div class="flex gap-3 mb-6">
                <input type="text" id="skill-input" placeholder="Enter new skill name..." class="flex-1 px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" />
                <button onclick="handleAddSkill()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg transition flex items-center gap-2 shadow-md hover:shadow-lg">
                  <i class="fas fa-plus"></i> Add
                </button>
              </div>
            </div>

            <!-- Skills Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${skillsHtml || '<div class="col-span-full text-center py-12 text-gray-500"><i class="fas fa-inbox text-4xl mb-4"></i><p>No skills added yet</p></div>'}
            </div>
          </div>
        </div>
      `;
    }

    async function renderSkillDetail() {
      const notes = await getNotes(selectedSkill.id);
      const notesHtml = notes.map(note => `
        <div class="group bg-white rounded-xl border-l-4 border-blue-500 p-5 hover:shadow-md transition slide-in">
          <div class="flex items-start justify-between">
            <div class="flex-1">
              <p class="text-gray-800 whitespace-pre-wrap leading-relaxed">${note.content}</p>
              <p class="text-xs text-gray-400 mt-3">
                <i class="fas fa-calendar-alt"></i> ${new Date(note.created_at).toLocaleDateString('en-US')}
              </p>
            </div>
            <button onclick="handleDeleteNote(${note.id}, event)" class="opacity-0 group-hover:opacity-100 bg-red-100 text-red-600 hover:bg-red-200 p-2 rounded-lg transition">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      `).join("");

      return `
        <div class="min-h-screen bg-gray-50">
          <!-- Header -->
          <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
              <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                  <i class="fas fa-book-open"></i> Skill Notes
                </h1>
              </div>
              <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg transition flex items-center gap-2 shadow-md hover:shadow-lg">
                <i class="fas fa-sign-out-alt"></i> Sign Out
              </button>
            </div>
          </header>

          <!-- Main Content -->
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Back Button & Title -->
            <div class="mb-8 flex items-center gap-4">
              <button onclick="selectedSkill=null;render();" class="bg-gray-200 hover:bg-gray-300 text-gray-800 p-3 rounded-lg transition">
                <i class="fas fa-arrow-left text-xl"></i>
              </button>
              <div>
                <h2 class="text-4xl font-bold text-gray-800">${selectedSkill.title}</h2>
                <p class="text-gray-600 mt-2">${notes.length} active notes</p>
              </div>
            </div>

            <!-- Add Note Section -->
            <div class="bg-white rounded-xl shadow-sm p-6 mb-8 slide-in">
              <h3 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-pen-fancy text-blue-500"></i> Add New Note
              </h3>
              <div class="flex flex-col gap-4">
                <textarea id="note-input" placeholder="What did you learn? Write here..." class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition resize-none" rows="4"></textarea>
                <button onclick="handleAddNote()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg transition flex items-center justify-center gap-2 shadow-md hover:shadow-lg">
                  <i class="fas fa-plus"></i> Add Note
                </button>
              </div>
            </div>

            <!-- Notes List -->
            <div>
              <h3 class="text-2xl font-bold text-gray-800 mb-4">
                <i class="fas fa-list text-blue-500"></i> Your Notes
              </h3>
              <div class="space-y-4">
                ${notesHtml || '<div class="text-center py-12 text-gray-500"><i class="fas fa-inbox text-4xl mb-4"></i><p>No notes yet. Start writing!</p></div>'}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function render() {
      const app = document.getElementById("app");

      if (!currentToken) {
        app.innerHTML = renderLoginPage();
      } else {
        allSkills = await getSkills();
        app.innerHTML = await renderDashboard();
      }
    }

    // Initialize
    render();
  </script>
</body>
</html>
